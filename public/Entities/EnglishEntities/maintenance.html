<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maintenance Log | CityWheelsPK</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="CSS/Maintenance.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CW</div>
        <h2>CityWheelsPK</h2>
      </div>
         <nav>
        <a href="/index.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="Ride.html"><i class="fas fa-route"></i> Rides</a>
        <a href="Driver.html"><i class="fas fa-id-card-alt"></i> Drivers</a>
        <a href="Passenger.html"><i class="fas fa-user-friends"></i>Passengers </a>
        <a href="Vehicle.html"><i class="fas fa-car"></i> Veicle Management</a>
        <a href="Promotion.html"><i class="fas fa-percentage"></i> Promotions</a>
        <a href="support.html"><i class="fas fa-headset"></i> Support</a>
        <a href="maintenance.html" class="active"><i class="fas fa-tools"></i> Maintenance</a>
        <a href="payment.html"><i class="fas fa-credit-card"></i> Payment</a>
        <a href="feedback.html"><i class="fas fa-comment-alt"></i>Feedback</a>
      </nav>
    </aside>

    <main class="content">
      <div class="page-header">
        <div class="page-title">
          <h1>Vehicle Maintenance</h1>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Log Maintenance Record</h3>
        </div>

        <form id="maintenanceForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="vehicle">Vehicle</label>
              <div class="input-wrapper">
                <i class="fas fa-car"></i>
                <select id="vehicle" name="vehicle" required>
                  <option value="" disabled selected>Select Vehicle</option>
                  <option value="301">Toyota - LEA-1234</option>
                  <option value="302">Honda - LHR-5678</option>
                  <option value="303">Suzuki - ISB-9012</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="performedBy">Performed By</label>
              <div class="input-wrapper">
                <i class="fas fa-user-tie"></i>
                <input type="text" id="performedBy" name="performedBy" placeholder="Mechanic Name" required>
              </div>
            </div>

            <div class="form-group">
              <label for="cost">Cost (PKR)</label>
              <div class="input-wrapper">
                <i class="fas fa-money-bill-wave"></i>
                <input type="number" step="0.01" id="cost" name="cost" placeholder="0.00" required>
              </div>
            </div>

            <div class="form-group full-width">
              <label for="description">Maintenance Description</label>
              <textarea id="description" name="description" placeholder="Details of the maintenance work done"></textarea>
            </div>

            <div class="form-group">
              <label for="date">Maintenance Date</label>
              <div class="input-wrapper">
                <i class="fas fa-calendar-day"></i>
                <input type="date" id="date" name="date" required>
              </div>
            </div>

            <div class="form-actions">
              <div class="support-text">Need assistance? <a href="/T&C/Contact.html">Contact Support</a></div>
              <button type="submit" class="btn"><i class="fas fa-save"></i> Save Maintenance Record</button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script>
    document.getElementById('maintenanceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = {
    vehicleId: document.getElementById('vehicle').value,
    performedBy: document.getElementById('performedBy').value,
    cost: document.getElementById('cost').value,
    description: document.getElementById('description').value,
    date: document.getElementById('date').value
  };

  try {
    const response = await fetch('/api/maintenance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });
    
    const result = await response.json();
    
    if (!response.ok) throw new Error(result.error || 'Failed to log maintenance');
    
    alert(`✅ Maintenance logged successfully! ID: ${result.maintenanceId}`);
    document.getElementById('maintenanceForm').reset();
  } catch (err) {
    alert(`❌ Error: ${err.message}`);
    console.error('Error:', err);
  }
});
  </script>
</body>
</html>
